plugins { id 'com.android.application' }

android {
    namespace 'ir.tipaxyar.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.tipaxyar.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
}
